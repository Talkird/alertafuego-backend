name: Tests

# Unit and API tests with coverage on every PR to main. The API tests run against a
# throwaway PostGIS container, migrated by the tests themselves (tests/conftest.py).
# Earth Engine, Supabase, SES and Telegram are mocked: no secrets needed.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alertafuego_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/alertafuego_test
    steps:
      - uses: actions/checkout@v4

      # Same Python as the Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lambda.txt
            requirements-dev.txt

      # requirements-lambda.txt: the production image's dependencies, with CPU-only
      # torch (requirements.txt pins the multi-GB CUDA build).
      - name: Install dependencies
        run: pip install -r requirements-lambda.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
